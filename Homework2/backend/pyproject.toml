[project]
name = "mykanban-backend"
version = "0.1.0"
description = "MyKanban FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
